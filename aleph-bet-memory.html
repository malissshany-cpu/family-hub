<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>משחק זיכרון - הא"ב העברי</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --sky-1: #BFEAF5;
    --sky-2: #FFF3D6;
    --card-back-1: #2B2D6B;
    --card-back-2: #4A4FB0;
    --ink: #21214A;
    --gold: #FFC94A;
    --white: #FFFFFF;
  }
  *{ box-sizing: border-box; }
  html,body{
    margin:0; padding:0; min-height:100vh;
    font-family:'Rubik', sans-serif;
    background: radial-gradient(circle at 20% 15%, var(--sky-2), transparent 55%),
                radial-gradient(circle at 85% 80%, var(--sky-1), transparent 50%),
                linear-gradient(160deg, #EAF7FB 0%, #FFF9EA 100%);
    color: var(--ink);
    overflow-x:hidden;
  }
  .stage{
    min-height:100vh;
    display:flex; flex-direction:column; align-items:center;
    padding: 18px 12px 40px;
  }

  /* ---------- Header ---------- */
  h1.title{
    font-size: clamp(28px, 6vw, 44px);
    font-weight:900;
    margin: 6px 0 2px;
    letter-spacing: 1px;
    text-shadow: 2px 2px 0 rgba(255,255,255,.6);
  }
  .subtitle{
    font-size: clamp(14px, 3vw, 17px);
    font-weight: 600;
    opacity:.75;
    margin-bottom: 14px;
  }

  /* ---------- Screens ---------- */
  .screen{ width:100%; max-width: 700px; display:flex; flex-direction:column; align-items:center; }
  .hidden{ display:none !important; }

  /* ---------- Difficulty picker ---------- */
  .picker-card{
    background: var(--white);
    border-radius: 28px;
    padding: 26px 22px 30px;
    box-shadow: 0 12px 0 rgba(43,45,107,.12), 0 18px 34px rgba(43,45,107,.15);
    width:100%;
    text-align:center;
  }
  .picker-card p.lead{ font-weight:700; font-size: 18px; margin: 4px 0 20px; }
  .levels{ display:flex; flex-direction:column; gap:14px; }
  .level-btn{
    border:none; cursor:pointer;
    border-radius:20px;
    padding: 16px 18px;
    font-family:inherit; font-weight:700; font-size:19px;
    color: var(--white);
    display:flex; align-items:center; justify-content:space-between;
    box-shadow: 0 6px 0 rgba(0,0,0,.15);
    transition: transform .08s ease;
  }
  .level-btn:active{ transform: translateY(4px); box-shadow:none; }
  .level-btn .emoji{ font-size:26px; }
  .level-btn small{ display:block; font-weight:600; font-size:13px; opacity:.9; margin-top:2px;}
  .lvl-1{ background: linear-gradient(135deg,#6BCB77,#3FA34D); }
  .lvl-2{ background: linear-gradient(135deg,#4D96FF,#2E6BDB); }
  .lvl-3{ background: linear-gradient(135deg,#9B5DE5,#7133C4); }
  .lvl-4{ background: linear-gradient(135deg,#FFB347,#E8871E); }

  /* ---------- Game bar ---------- */
  .topbar{
    width:100%; max-width: 700px;
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom: 14px; gap: 10px; flex-wrap: wrap;
  }
  .back-btn{
    border:none; background: var(--white); color: var(--ink);
    font-family:inherit; font-weight:700; font-size:15px;
    padding: 10px 16px; border-radius: 16px; cursor:pointer;
    box-shadow: 0 4px 0 rgba(0,0,0,.1);
  }
  .back-btn:active{ transform: translateY(3px); box-shadow:none; }
  .moves{
    font-weight:700; font-size:15px; background: var(--white);
    padding: 10px 16px; border-radius:16px; box-shadow: 0 4px 0 rgba(0,0,0,.1);
  }

  /* ---------- Necklace progress ---------- */
  .necklace{
    display:flex; gap:8px; justify-content:center; flex-wrap:wrap;
    margin-bottom: 18px; padding: 10px 16px;
    background: rgba(255,255,255,.6); border-radius: 20px;
  }
  .bead{
    width: 22px; height:22px; border-radius:50%;
    background: #E4E4F2;
    border: 2px solid rgba(0,0,0,.06);
    transition: all .35s ease;
  }
  .bead.filled{ box-shadow: 0 0 0 3px rgba(255,255,255,.7) inset; transform: scale(1.15); }

  /* ---------- Board ---------- */
  .board{
    display:grid;
    gap: 10px;
    width:100%;
    max-width: 680px;
    perspective: 1000px;
  }
  .card{
    position:relative;
    aspect-ratio: 3/4;
    cursor:pointer;
  }
  .card-inner{
    position:absolute; inset:0;
    transform-style: preserve-3d;
    transition: transform .5s cubic-bezier(.4,1.4,.5,1);
  }
  .card.flipped .card-inner{ transform: rotateY(180deg); }
  .card.matched .card-inner{ transform: rotateY(180deg); }
  .card-face{
    position:absolute; inset:0;
    border-radius: 16px;
    display:flex; align-items:center; justify-content:center;
    backface-visibility: hidden;
    box-shadow: 0 6px 0 rgba(0,0,0,.15);
  }
  .card-back{
    background: linear-gradient(145deg, var(--card-back-1), var(--card-back-2));
    background-image:
      radial-gradient(rgba(255,255,255,.25) 2px, transparent 2px),
      linear-gradient(145deg, var(--card-back-1), var(--card-back-2));
    background-size: 16px 16px, cover;
  }
  .card-back .star{ font-size: clamp(20px,6vw,30px); color: rgba(255,255,255,.85); }
  .card-front{
    background: var(--white);
    transform: rotateY(180deg);
    flex-direction: column;
    gap: 2px;
  }
  .card-front .pic{
    font-size: clamp(22px, 7vw, 34px);
    line-height: 1;
  }
  .card-front .letter{
    font-size: clamp(32px, 10vw, 52px);
    font-weight: 900;
    line-height: 1;
  }
  .card.matched .card-face{ box-shadow: 0 0 0 4px var(--gold), 0 6px 0 rgba(0,0,0,.15); }
  .card.wrong .card-inner{ animation: shake .4s ease; }
  @keyframes shake{
    0%,100%{ transform: rotateY(180deg) translateX(0); }
    25%{ transform: rotateY(180deg) translateX(-6px); }
    75%{ transform: rotateY(180deg) translateX(6px); }
  }
  @keyframes pop{
    0%{ transform: scale(1); }
    50%{ transform: scale(1.08); }
    100%{ transform: scale(1); }
  }
  .card.matched{ animation: pop .4s ease; }

  /* ---------- Win screen ---------- */
  .win-card{
    background: var(--white);
    border-radius: 28px;
    padding: 34px 26px;
    text-align:center;
    box-shadow: 0 12px 0 rgba(43,45,107,.12), 0 18px 34px rgba(43,45,107,.15);
    width:100%;
  }
  .win-card .big-emoji{ font-size: 60px; display:block; margin-bottom:10px; }
  .win-card h2{ font-size: 26px; margin: 4px 0 6px; }
  .win-card p{ font-weight:600; opacity:.7; margin-bottom: 20px; }
  .again-btn{
    border:none; cursor:pointer; font-family:inherit;
    background: linear-gradient(135deg,#FFB347,#FF7A3D);
    color:white; font-weight:800; font-size:18px;
    padding: 14px 30px; border-radius: 18px;
    box-shadow: 0 6px 0 rgba(0,0,0,.15);
  }
  .again-btn:active{ transform: translateY(4px); box-shadow:none; }

  .floating{
    position:fixed; pointer-events:none; font-size:28px;
    animation: floatUp 1.1s ease-out forwards;
    z-index: 50;
  }
  @keyframes floatUp{
    0%{ opacity:1; transform: translateY(0) scale(1); }
    100%{ opacity:0; transform: translateY(-90px) scale(1.4); }
  }
</style>
</head>
<body>

<a href="games.html" style="position:fixed;top:14px;right:14px;z-index:9999;font-family:sans-serif;font-weight:700;font-size:13px;color:#6B4C6B;background:#fff;padding:8px 14px;border-radius:999px;box-shadow:0 4px 10px rgba(0,0,0,0.12);text-decoration:none;">← חזרה למשחקים</a>

<div class="stage">
  <h1 class="title">🔤 משחק זיכרון - הא"ב</h1>
  <div class="subtitle">מצאו את זוגות האותיות התואמות</div>

  <!-- Difficulty picker -->
  <div class="screen" id="pickerScreen">
    <div class="picker-card">
      <p class="lead">כמה אותיות ללמוד היום?</p>
      <div class="levels">
        <button class="level-btn lvl-1" data-count="6">
          <span>קטן <small>6 זוגות · א-ו</small></span>
          <span class="emoji">🌱</span>
        </button>
        <button class="level-btn lvl-2" data-count="10">
          <span>בינוני <small>10 זוגות · א-י</small></span>
          <span class="emoji">⭐</span>
        </button>
        <button class="level-btn lvl-3" data-count="16">
          <span>גדול <small>16 זוגות · א-ע</small></span>
          <span class="emoji">🏆</span>
        </button>
        <button class="level-btn lvl-4" data-count="22">
          <span>כל האותיות <small>22 זוגות · א-ת</small></span>
          <span class="emoji">👑</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Game screen -->
  <div class="screen hidden" id="gameScreen">
    <div class="topbar">
      <button class="back-btn" id="backBtn">↩ החלף רמה</button>
      <div class="moves">מהלכים: <span id="movesCount">0</span></div>
    </div>
    <div class="necklace" id="necklace"></div>
    <div class="board" id="board"></div>
  </div>

  <!-- Win screen -->
  <div class="screen hidden" id="winScreen">
    <div class="win-card">
      <span class="big-emoji">🎉</span>
      <h2>כל הכבוד!</h2>
      <p id="winSummary"></p>
      <button class="again-btn" id="againBtn">שחקו שוב</button>
    </div>
  </div>
</div>

<script>
const ALPHABET = [
  {letter:'א', name:'אלף', word:'אריה', emoji:'🦁'},
  {letter:'ב', name:'בית', word:'בננה', emoji:'🍌'},
  {letter:'ג', name:'גימל', word:'גמל', emoji:'🐫'},
  {letter:'ד', name:'דלת', word:'דג', emoji:'🐟'},
  {letter:'ה', name:'הא', word:'הר', emoji:'⛰️'},
  {letter:'ו', name:'וו', word:'ורד', emoji:'🌹'},
  {letter:'ז', name:'זין', word:'זברה', emoji:'🦓'},
  {letter:'ח', name:'חית', word:'חתול', emoji:'🐱'},
  {letter:'ט', name:'טית', word:'טווס', emoji:'🦚'},
  {letter:'י', name:'יוד', word:'ירח', emoji:'🌙'},
  {letter:'כ', name:'כף', word:'כלב', emoji:'🐶'},
  {letter:'ל', name:'למד', word:'לב', emoji:'❤️'},
  {letter:'מ', name:'מם', word:'מטריה', emoji:'☂️'},
  {letter:'נ', name:'נון', word:'נחש', emoji:'🐍'},
  {letter:'ס', name:'סמך', word:'סוס', emoji:'🐴'},
  {letter:'ע', name:'עין', word:'ענבים', emoji:'🍇'},
  {letter:'פ', name:'פה', word:'פיל', emoji:'🐘'},
  {letter:'צ', name:'צדי', word:'צב', emoji:'🐢'},
  {letter:'ק', name:'קוף', word:'קוף', emoji:'🐵'},
  {letter:'ר', name:'ריש', word:'רכבת', emoji:'🚂'},
  {letter:'ש', name:'שין', word:'שמש', emoji:'☀️'},
  {letter:'ת', name:'תו', word:'תות', emoji:'🍓'},
];
const PALETTE = ['#FF6B6B','#FFB347','#4D96FF','#6BCB77','#9B5DE5','#FF6FB5','#00C2A8','#F77F00','#5390D9','#E63946'];

const pickerScreen = document.getElementById('pickerScreen');
const gameScreen = document.getElementById('gameScreen');
const winScreen = document.getElementById('winScreen');
const board = document.getElementById('board');
const necklaceEl = document.getElementById('necklace');
const movesCountEl = document.getElementById('movesCount');
const winSummary = document.getElementById('winSummary');

let state = {
  cards: [],
  flipped: [],
  matchedCount: 0,
  totalPairs: 0,
  moves: 0,
  lock: false,
};

let hebrewVoice = null;
let voicesReady = false;

function loadVoices(){
  if(!('speechSynthesis' in window)) return;
  const voices = speechSynthesis.getVoices();
  if(voices && voices.length){
    hebrewVoice = voices.find(v => v.lang && v.lang.toLowerCase().startsWith('he')) || null;
    voicesReady = true;
  }
}

if('speechSynthesis' in window){
  loadVoices();
  speechSynthesis.onvoiceschanged = loadVoices;
}

function speak(text){
  if(!('speechSynthesis' in window)) return;
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'he-IL';
    u.rate = 0.85;
    u.pitch = 1.05;
    if(hebrewVoice) u.voice = hebrewVoice;
    speechSynthesis.speak(u);
  }catch(e){}
}

// Mobile browsers only allow speech synthesis that is triggered synchronously
// inside a real user tap. This "unlocks" it on the very first tap of the game.
let speechUnlocked = false;
function unlockSpeech(){
  if(speechUnlocked || !('speechSynthesis' in window)) return;
  speechUnlocked = true;
  try{
    const u = new SpeechSynthesisUtterance(' ');
    u.volume = 0;
    speechSynthesis.speak(u);
  }catch(e){}
}
document.addEventListener('pointerdown', unlockSpeech, { once: true });

function beep(freqStart, freqEnd, duration){
  try{
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.frequency.setValueAtTime(freqStart, ctx.currentTime);
    osc.frequency.linearRampToValueAtTime(freqEnd, ctx.currentTime + duration);
    gain.gain.setValueAtTime(0.15, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
    osc.start(); osc.stop(ctx.currentTime + duration);
  }catch(e){}
}

function shuffle(arr){
  for(let i = arr.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i+1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

document.querySelectorAll('.level-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    const count = parseInt(btn.dataset.count, 10);
    startGame(count);
  });
});

document.getElementById('backBtn').addEventListener('click', ()=>{
  gameScreen.classList.add('hidden');
  pickerScreen.classList.remove('hidden');
});
document.getElementById('againBtn').addEventListener('click', ()=>{
  winScreen.classList.add('hidden');
  pickerScreen.classList.remove('hidden');
});

function startGame(count){
  const chosen = ALPHABET.slice(0, count).map((l, i) => ({...l, color: PALETTE[i % PALETTE.length]}));
  let deck = [];
  chosen.forEach(l => { deck.push({...l}); deck.push({...l}); });
  deck = shuffle(deck).map((c, idx) => ({...c, id: idx, flippedUp:false, matched:false}));

  state = { cards: deck, flipped: [], matchedCount: 0, totalPairs: count, moves: 0, awaitingReset:false };

  pickerScreen.classList.add('hidden');
  winScreen.classList.add('hidden');
  gameScreen.classList.remove('hidden');
  movesCountEl.textContent = '0';

  renderNecklace();
  renderBoard();
}

function renderNecklace(){
  necklaceEl.innerHTML = '';
  for(let i=0;i<state.totalPairs;i++){
    const b = document.createElement('div');
    b.className = 'bead';
    b.id = 'bead-' + i;
    necklaceEl.appendChild(b);
  }
}

function fillNextBead(color){
  const idx = state.matchedCount - 1;
  const b = document.getElementById('bead-' + idx);
  if(b){ b.classList.add('filled'); b.style.background = color; }
}

function columnsFor(totalCards){
  if(totalCards <= 12) return 4;
  if(totalCards <= 20) return 5;
  if(totalCards <= 32) return 6;
  return 7;
}

function renderBoard(){
  const total = state.cards.length;
  board.style.gridTemplateColumns = `repeat(${columnsFor(total)}, 1fr)`;
  board.innerHTML = '';
  state.cards.forEach(card => {
    const el = document.createElement('div');
    el.className = 'card';
    el.dataset.id = card.id;
    el.innerHTML = `
      <div class="card-inner">
        <div class="card-face card-back"><span class="star">★</span></div>
        <div class="card-face card-front">
          <div class="pic">${card.emoji}</div>
          <div class="letter" style="color:${card.color}">${card.letter}</div>
        </div>
      </div>
    `;
    el.addEventListener('click', () => onCardClick(card.id, el));
    board.appendChild(el);
  });
}

function closeMismatched(){
  state.flipped.forEach(({card, el}) => {
    card.flippedUp = false;
    el.classList.remove('flipped','wrong');
  });
  state.flipped = [];
  state.awaitingReset = false;
}

function onCardClick(id, el){
  const card = state.cards.find(c => c.id === id);
  if(!card || card.matched) return;

  // Two mismatched cards are currently showing, waiting for the user to close them.
  if(state.awaitingReset){
    const isOneOfTheShownPair = state.flipped.some(f => f.card.id === card.id);
    if(isOneOfTheShownPair){
      // Clicking either shown card flips them back down.
      closeMismatched();
      return;
    }
    // Clicking a different card: close the old pair first, then continue below to flip the new one.
    closeMismatched();
  }

  if(card.flippedUp) return;
  if(state.flipped.length === 2) return;

  card.flippedUp = true;
  el.classList.add('flipped');
  speak(card.name);
  state.flipped.push({card, el});

  if(state.flipped.length === 2){
    state.moves++;
    movesCountEl.textContent = state.moves;
    const [a, b] = state.flipped;
    if(a.card.letter === b.card.letter){
      setTimeout(()=>{
        a.card.matched = true; b.card.matched = true;
        a.el.classList.add('matched'); b.el.classList.add('matched');
        state.matchedCount++;
        fillNextBead(a.card.color);
        beep(500, 900, 0.25);
        popEmoji(a.el, '✨');
        state.flipped = [];
        if(state.matchedCount === state.totalPairs){
          setTimeout(showWin, 500);
        }
      }, 500);
    } else {
      a.el.classList.add('wrong'); b.el.classList.add('wrong');
      beep(300, 150, 0.3);
      state.awaitingReset = true;
    }
  }
}

function popEmoji(el, emoji){
  const rect = el.getBoundingClientRect();
  const span = document.createElement('div');
  span.className = 'floating';
  span.textContent = emoji;
  span.style.left = (rect.left + rect.width/2 - 14) + 'px';
  span.style.top = (rect.top + rect.height/2 - 14) + 'px';
  document.body.appendChild(span);
  setTimeout(()=> span.remove(), 1100);
}

function showWin(){
  gameScreen.classList.add('hidden');
  winScreen.classList.remove('hidden');
  winSummary.textContent = `סיימתם ב-${state.moves} מהלכים 🎈`;
  speak('כל הכבוד! סיימתם את המשחק');
}
</script>
</body>
</html>
