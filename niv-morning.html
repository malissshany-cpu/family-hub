<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>רשימת המשימות של הבוקר</title>
<style>
  * { box-sizing: border-box; }
  #confettiCanvas {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    pointer-events: none;
    z-index: 9999;
  }
  body {
    margin: 0;
    padding: 20px 14px 40px;
    background: #fdf6e9;
    font-family: 'Segoe UI', Arial, sans-serif;
    direction: rtl;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  h1 {
    color: #8a5a2b;
    font-size: 1.6rem;
    margin: 6px 0 18px;
    text-align: center;
  }
  .back {
    align-self: flex-start;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: 'Segoe UI', Arial, sans-serif;
    font-weight: 700;
    font-size: 14px;
    color: #6B4C6B;
    text-decoration: none;
    margin-bottom: 10px;
  }
  .back:hover { text-decoration: underline; }
  .list {
    width: 100%;
    max-width: 480px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .item {
    display: flex;
    align-items: center;
    gap: 14px;
    background: #f6e3c7;
    border-radius: 20px;
    padding: 10px;
    transition: background 0.25s, transform 0.15s;
  }
  .item.done {
    background: #d6f0d0;
  }
  .item.done .label {
    color: #4b8a3f;
  }
  .pic {
    width: 92px;
    height: 92px;
    object-fit: cover;
    border-radius: 14px;
    flex-shrink: 0;
    background: #fdf1de;
  }
  .label {
    flex: 1;
    font-size: 1.08rem;
    color: #6b4a26;
    font-weight: 600;
  }
  .checkbox {
    width: 44px;
    height: 44px;
    border-radius: 12px;
    border: 3px solid #8a5a2b;
    background: #fffdf8;
    flex-shrink: 0;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.5rem;
    color: transparent;
    user-select: none;
    transition: background 0.2s, color 0.2s, transform 0.1s;
  }
  .checkbox.checked {
    background: #4b8a3f;
    border-color: #4b8a3f;
    color: #fff;
    transform: scale(1.08);
  }
  .checkbox:active {
    transform: scale(0.9);
  }
  .progress-wrap {
    width: 100%;
    max-width: 480px;
    margin: 18px 0 6px;
  }
  .progress-bar-bg {
    background: #eddcbc;
    border-radius: 12px;
    height: 22px;
    overflow: hidden;
  }
  .progress-bar-fill {
    background: linear-gradient(90deg, #7cc96a, #4b8a3f);
    height: 100%;
    width: 0%;
    border-radius: 12px;
    transition: width 0.4s ease;
  }
  .progress-text {
    text-align: center;
    margin-top: 6px;
    color: #8a5a2b;
    font-weight: bold;
  }
  .celebrate {
    text-align: center;
    font-size: 1.3rem;
    color: #4b8a3f;
    font-weight: bold;
    margin-top: 14px;
    min-height: 1.6em;
  }
  .reset-btn {
    margin-top: 22px;
    background: #e97452;
    color: #fff;
    border: none;
    padding: 12px 30px;
    border-radius: 16px;
    font-size: 1.1rem;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 3px 0 #c9573a;
  }
  .reset-btn:active {
    box-shadow: 0 1px 0 #c9573a;
    transform: translateY(2px);
  }
</style>
</head>

<div class="celebrate" id="celebrate"></div>

<button class="reset-btn" id="resetBtn">🔄 איפוס</button>

<script>
  const STORAGE_KEY = 'morningChecklistState';
  const total = 7;

  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : {};
    } catch (e) {
      return {};
    }
  }

  function saveState(state) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }

  function render() {
    const state = loadState();
    let checkedCount = 0;

    document.querySelectorAll('.checkbox').forEach(cb => {
      const id = cb.dataset.id;
      const isChecked = !!state[id];
      cb.classList.toggle('checked', isChecked);
      cb.closest('.item').classList.toggle('done', isChecked);
      if (isChecked) checkedCount++;
    });

    const pct = Math.round((checkedCount / total) * 100);
    document.getElementById('progressFill').style.width = pct + '%';
    document.getElementById('progressText').textContent = checkedCount + ' מתוך ' + total;

    const celebrate = document.getElementById('celebrate');
    celebrate.textContent = checkedCount === total ? '🎉 כל הכבוד! סיימת הכל! 🎉' : '';
  }

  // ---- confetti engine ----
  const confettiCanvas = document.getElementById('confettiCanvas');
  const confettiCtx = confettiCanvas.getContext('2d');
  let confettiParticles = [];
  let confettiRunning = false;
  const CONFETTI_COLORS = ['#e97452', '#f2c879', '#7cc96a', '#6b4c6b', '#4b8a3f', '#f2a65a', '#5aa9e6'];

  function resizeConfettiCanvas() {
    confettiCanvas.width = window.innerWidth;
    confettiCanvas.height = window.innerHeight;
  }
  resizeConfettiCanvas();
  window.addEventListener('resize', resizeConfettiCanvas);

  function spawnConfetti(originX, originY, count, opts) {
    opts = opts || {};
    const spread = opts.spread !== undefined ? opts.spread : Math.PI / 2;
    const baseAngle = opts.baseAngle !== undefined ? opts.baseAngle : -Math.PI / 2;
    const power = opts.power || 9;
    const maxLife = opts.maxLife || 80;

    for (let i = 0; i < count; i++) {
      const angle = baseAngle + (Math.random() - 0.5) * spread;
      const speed = power * (0.5 + Math.random());
      confettiParticles.push({
        x: originX,
        y: originY,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        size: 5 + Math.random() * 6,
        color: CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)],
        rotation: Math.random() * 360,
        rotSpeed: (Math.random() - 0.5) * 22,
        gravity: 0.28 + Math.random() * 0.16,
        drag: 0.985,
        life: 0,
        maxLife: maxLife + Math.random() * 30,
        shape: Math.random() < 0.5 ? 'rect' : 'circle'
      });
    }

    if (!confettiRunning) {
      confettiRunning = true;
      requestAnimationFrame(confettiTick);
    }
  }

  function confettiTick() {
    confettiCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);

    confettiParticles.forEach(p => {
      p.vy += p.gravity;
      p.vx *= p.drag;
      p.vy *= p.drag;
      p.x += p.vx;
      p.y += p.vy;
      p.rotation += p.rotSpeed;
      p.life++;

      confettiCtx.save();
      confettiCtx.translate(p.x, p.y);
      confettiCtx.rotate(p.rotation * Math.PI / 180);
      confettiCtx.globalAlpha = Math.max(0, 1 - p.life / p.maxLife);
      confettiCtx.fillStyle = p.color;
      if (p.shape === 'rect') {
        confettiCtx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
      } else {
        confettiCtx.beginPath();
        confettiCtx.arc(0, 0, p.size / 2, 0, Math.PI * 2);
        confettiCtx.fill();
      }
      confettiCtx.restore();
    });

    confettiParticles = confettiParticles.filter(p => p.life < p.maxLife && p.y < confettiCanvas.height + 40);

    if (confettiParticles.length > 0) {
      requestAnimationFrame(confettiTick);
    } else {
      confettiRunning = false;
      confettiCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
    }
  }

  function celebrateTask(cb) {
    const rect = cb.getBoundingClientRect();
    spawnConfetti(rect.left + rect.width / 2, rect.top + rect.height / 2, 22, {
      spread: Math.PI * 0.9,
      power: 7,
      maxLife: 60
    });
  }

  function celebrateAllDone() {
    const w = window.innerWidth;

    // fireworks burst from the center
    spawnConfetti(w / 2, window.innerHeight * 0.35, 140, {
      spread: Math.PI * 2,
      power: 13,
      maxLife: 150
    });

    // waves of confetti raining from the top
    for (let i = 0; i < 8; i++) {
      setTimeout(() => {
        spawnConfetti(Math.random() * w, -20, 35, {
          baseAngle: Math.PI / 2,
          spread: Math.PI * 0.7,
          power: 5,
          maxLife: 160
        });
      }, i * 150);
    }
  }
  // ---- end confetti engine ----

  document.querySelectorAll('.checkbox').forEach(cb => {
    cb.addEventListener('click', () => {
      const state = loadState();
      const id = cb.dataset.id;
      const newlyChecked = !state[id];
      state[id] = newlyChecked;
      saveState(state);
      render();

      if (newlyChecked) {
        celebrateTask(cb);

        const checkedCount = Object.values(state).filter(Boolean).length;
        if (checkedCount === total) {
          setTimeout(celebrateAllDone, 150);
        }
      }
    });
  });

  document.getElementById('resetBtn').addEventListener('click', () => {
    localStorage.removeItem(STORAGE_KEY);
    render();
  });

  render();
</script>

</body>
</html>
