<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>אוכל | Food</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;900&family=Assistant:wght@400;600;700&display=swap');

  :root{
    --mint: #7FB5A3;
    --plum: #6B4C6B;
    --butter: #F2C879;
    --paper: #FBF7EF;
    --ink: #2C2A28;
    --shelf: #C9A876;
  }

  *{ box-sizing: border-box; margin:0; padding:0; }

  body{
    background: var(--paper);
    color: var(--ink);
    font-family: 'Assistant', sans-serif;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  .topbar{
    max-width: 920px;
    margin: 0 auto;
    padding: 24px 20px 0;
  }

  .back{
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: 'Assistant', sans-serif;
    font-weight: 700;
    font-size: 14px;
    color: var(--plum);
    text-decoration: none;
  }

  .back:hover{ text-decoration: underline; }

  .hero{
    padding: 32px 24px 40px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }

  .hero::before{
    content: "";
    position: absolute;
    top: -60px; left: 50%;
    width: 340px; height: 340px;
    background: radial-gradient(circle, rgba(107,76,107,0.18) 0%, transparent 70%);
    transform: translateX(-50%);
  }

  h1{
    font-family: 'Rubik', sans-serif;
    font-weight: 900;
    font-size: clamp(30px, 7vw, 44px);
    color: var(--ink);
    line-height: 1.1;
    position: relative;
  }

  .subtitle{
    font-family: 'Rubik', sans-serif;
    font-weight: 500;
    font-size: 15px;
    color: #6b6560;
    margin-top: 8px;
    direction: ltr;
  }

  .shelf-wrap{
    max-width: 920px;
    margin: 0 auto;
    padding: 0 20px 80px;
  }

  .shelf{
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 28px;
    position: relative;
    padding-bottom: 26px;
  }

  .shelf::after{
    content: "";
    position: absolute;
    bottom: 0; left: -6px; right: -6px;
    height: 14px;
    background: linear-gradient(180deg, var(--shelf) 0%, #B8935E 100%);
    border-radius: 4px;
    box-shadow: 0 8px 14px rgba(0,0,0,0.15);
  }

  .card{
    background: #fff;
    border-radius: 18px;
    padding: 26px 22px 22px;
    position: relative;
    box-shadow: 0 10px 0 -4px rgba(0,0,0,0.04), 0 14px 24px rgba(44,42,40,0.08);
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    transform: rotate(var(--tilt, 0deg));
    transition: transform 0.25s ease, box-shadow 0.25s ease;
    text-decoration: none;
    color: var(--ink);
    border: 2px solid transparent;
  }

  .card:hover{
    transform: rotate(0deg) translateY(-6px);
    box-shadow: 0 20px 30px rgba(44,42,40,0.14);
  }

  .card:nth-child(1){ --tilt: -2deg; }
  .card:nth-child(2){ --tilt: 1.5deg; }

  .badge{
    width: 64px; height: 64px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 30px;
    margin-bottom: 16px;
  }

  .badge.mint{ background: var(--mint); }
  .badge.butter{ background: var(--butter); }
  .badge.plum{ background: var(--plum); }

  .card h2{
    font-family: 'Rubik', sans-serif;
    font-weight: 700;
    font-size: 19px;
    margin-bottom: 6px;
  }

  .card p{
    font-size: 14px;
    color: #7a746d;
    line-height: 1.5;
    margin-bottom: 16px;
  }

  .tag{
    font-family: 'Assistant', sans-serif;
    font-weight: 700;
    font-size: 12px;
    padding: 6px 14px;
    border-radius: 999px;
    background: var(--paper);
    border: 1.5px solid rgba(44,42,40,0.12);
    color: var(--plum);
  }

  .card.placeholder{
    opacity: 0.75;
    cursor: default;
  }

  .card.placeholder:hover{
    transform: rotate(var(--tilt, 0deg));
    box-shadow: 0 10px 0 -4px rgba(0,0,0,0.04), 0 14px 24px rgba(44,42,40,0.08);
  }

  .ribbon{
    position: absolute;
    top: 14px;
    left: -8px;
    background: var(--butter);
    color: var(--ink);
    font-family: 'Assistant', sans-serif;
    font-weight: 700;
    font-size: 11px;
    padding: 4px 10px;
    border-radius: 6px;
    transform: rotate(-6deg);
  }

  footer{
    text-align: center;
    padding: 0 24px 48px;
    font-size: 13px;
    color: #a29c93;
    direction: ltr;
  }

  @media (prefers-reduced-motion: reduce){
    .card{ transition: none; }
  }
</style>
</head>
<body>

  <div class="topbar">
    <a href="index.html" class="back">← חזרה הביתה</a>
  </div>

  <div class="hero">
    <h1>אוכל</h1>
    <div class="subtitle">Food</div>
  </div>

  <div class="shelf-wrap">
    <div class="shelf">

      <a href="#" class="card placeholder">
        <div class="ribbon">בקרוב</div>
        <div class="badge butter">🥄</div>
        <h2>תוכנית הטעימות</h2>
        <p>A gentle guide to starting solids, stage by stage.</p>
        <span class="tag">In progress</span>
      </a>

      <a href="#" class="card">
        <div class="badge plum">🦸</div>
        <h2>Niv's Hero HQ</h2>
        <p>Superhero missions that turn trying new foods into a game.</p>
        <span class="tag">Play now</span>
      </a>

    </div>
  </div>

  <footer>Made with love, one project at a time 💛</footer>

</body>
</html>
