<!doctype html><html lang="he" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>מי נולד קודם?</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Rubik:wght@400;500;700&display=swap">
<style>
  :root{
    --bg-old-top:#F7E8CB; --bg-old-bottom:#F0C9A0;
    --bg-new-top:#CFF1F1; --bg-new-bottom:#ABE0F2;
    --ink:#3A2E28; --ink-soft:#6B5A4E;
    --card:#FFFFFF; --card-border:#EADFCE;
    --shadow:rgba(58,46,40,0.16);
    --accent:#E8607A; --accent-2:#F4B740; --path-color:#C97A4A;
    --elder:#C97A4A; --adult:#4FB6C4; --kid:#F4B740; --toddler:#F08FA2; --baby:#B79CED;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg-old-top:#3B2A22; --bg-old-bottom:#5A3B27;
      --bg-new-top:#0E2A32; --bg-new-bottom:#123F49;
      --ink:#F5ECE0; --ink-soft:#CBB9A8;
      --card:#2A211B; --card-border:#4A3A2F;
      --shadow:rgba(0,0,0,0.5);
    }
  }
  :root[data-theme="dark"]{
    --bg-old-top:#3B2A22; --bg-old-bottom:#5A3B27;
    --bg-new-top:#0E2A32; --bg-new-bottom:#123F49;
    --ink:#F5ECE0; --ink-soft:#CBB9A8;
    --card:#2A211B; --card-border:#4A3A2F;
    --shadow:rgba(0,0,0,0.5);
  }

  *{box-sizing:border-box;}
  body{ background:var(--bg-old-top); }

  .sky{
    position:fixed; inset:0; z-index:0;
    background:linear-gradient(180deg, var(--bg-old-top) 0%, var(--bg-old-bottom) 100%);
    pointer-events:none;
  }

  .page{
    position:relative; z-index:1;
    max-width:760px; margin-inline:auto;
    padding-inline:20px; padding-block:28px 44px;
    display:flex; flex-direction:column; gap:22px;
    font-family:'Rubik', 'Heebo', sans-serif; color:var(--ink);
  }

  .top{ text-align:center; display:flex; flex-direction:column; gap:6px; }
  .back-link{
    display:inline-flex; align-items:center; gap:6px; align-self:flex-start;
    background:var(--card); color:var(--ink); text-decoration:none;
    font-family:'Rubik', sans-serif; font-size:.85rem; font-weight:600;
    padding:8px 18px; border-radius:999px; border:1px solid var(--card-border);
    box-shadow:0 2px 6px var(--shadow);
  }
  .back-link:hover{ text-decoration:underline; }
  .back-link:focus-visible{ outline:3px solid var(--accent); outline-offset:2px; }
  .title{
    font-family:'Baloo 2', sans-serif; font-weight:800;
    font-size:clamp(1.7rem, 6vw, 2.4rem); margin:0; text-wrap:balance;
  }
  .subtitle{ margin:0; color:var(--ink-soft); font-size:clamp(.9rem,3vw,1.05rem); text-wrap:balance; }

  .year-badge{
    align-self:center; background:var(--card); border:3px solid var(--path-color);
    border-radius:999px; padding:8px 30px; box-shadow:0 6px 18px var(--shadow);
    display:flex; flex-direction:column; align-items:center; gap:0;
  }
  .year-cap{ font-size:.72rem; color:var(--ink-soft); letter-spacing:.08em; font-weight:600; }
  .year-num{
    font-family:'Baloo 2', sans-serif; font-weight:800;
    font-size:clamp(2.1rem,9vw,3rem); line-height:1.1; color:var(--ink);
    font-variant-numeric:tabular-nums; letter-spacing:.5px;
  }
  @keyframes popScale{ 0%{transform:scale(1);} 35%{transform:scale(1.16);} 100%{transform:scale(1);} }
  .year-num.pop{ animation:popScale .38s ease; }

  .story{
    display:flex; align-items:center; gap:16px;
    background:var(--card); border:1px solid var(--card-border);
    border-radius:24px; padding:16px 20px; box-shadow:0 8px 22px var(--shadow);
  }
  .story-avatar{ flex-shrink:0; width:72px; height:72px; }
  .story-avatar svg{ width:100%; height:100%; display:block; }
  .avatar-photo{
    width:100%; height:100%; display:block; border-radius:50%;
    object-fit:cover; box-sizing:border-box; background:var(--card-border);
  }
  .avatar-placeholder{
    width:100%; height:100%; box-sizing:border-box; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background:var(--card-border); color:var(--ink);
    font-family:'Baloo 2', sans-serif; font-weight:800; font-size:1.3rem;
  }
  .avatar-elder{ border:3px solid var(--elder); }
  .avatar-adult{ border:3px solid var(--adult); }
  .avatar-kid{ border:3px solid var(--kid); }
  .avatar-toddler{ border:3px solid var(--toddler); }
  .avatar-baby{ border:3px solid var(--baby); }
  .story-text{ min-width:0; }
  .story-name{ font-family:'Baloo 2', sans-serif; font-weight:700; font-size:1.35rem; }
  .story-line{ font-size:.98rem; color:var(--ink-soft); margin-top:2px; }
  .story-age{ font-size:1.05rem; font-weight:600; margin-top:4px; }
  .story-badge{
    display:inline-block; margin-top:8px; font-size:.8rem; font-weight:700;
    background:var(--accent-2); color:#3A2E28; padding:3px 12px; border-radius:999px;
  }

  .nav-buttons{ display:flex; gap:12px; justify-content:center; flex-wrap:wrap; }
  .nav-btn{
    display:inline-flex; align-items:center; gap:9px;
    background:var(--accent-2); color:#3A2E28; border:none;
    padding:12px 20px; border-radius:999px; font-family:'Rubik', sans-serif;
    font-weight:700; font-size:.98rem; cursor:pointer; box-shadow:0 4px 10px var(--shadow);
    transition:transform .15s ease, opacity .15s ease;
  }
  .nav-btn:hover:not(:disabled){ transform:translateY(-2px); }
  .nav-btn:active:not(:disabled){ transform:translateY(0); }
  .nav-btn:disabled{ opacity:.4; cursor:default; box-shadow:none; }
  .nav-btn:focus-visible{ outline:3px solid var(--accent); outline-offset:2px; }
  .chev{ width:0; height:0; display:inline-block; }
  .chev-right{ border-top:7px solid transparent; border-bottom:7px solid transparent; border-left:9px solid currentColor; }
  .chev-left{ border-top:7px solid transparent; border-bottom:7px solid transparent; border-right:9px solid currentColor; }

  .track-wrap{
    overflow-x:auto; overflow-y:hidden; -webkit-overflow-scrolling:touch;
    background:var(--card); border:1px solid var(--card-border);
    border-radius:24px; box-shadow:0 8px 22px var(--shadow);
  }
  .track{ display:flex; flex-direction:column; min-width:max-content; padding-inline:26px; padding-block:10px 16px; }
  .lane{ position:relative; height:62px; }
  .path-line{
    position:absolute; left:0; right:0; top:50%; height:6px; margin-top:-3px;
    background:repeating-linear-gradient(90deg, var(--path-color) 0 14px, transparent 14px 22px);
    border-radius:3px; opacity:.6;
  }
  .runner{
    position:absolute; top:0; width:54px; height:54px; z-index:2;
    transition:left .45s cubic-bezier(.4,0,.2,1);
    touch-action:none; cursor:grab;
  }
  .runner:active{ cursor:grabbing; }
  .runner svg{ width:100%; height:100%; color:var(--accent); display:block;
    filter:drop-shadow(0 3px 6px var(--shadow)); }

  .stops-row{ display:flex; gap:20px; align-items:flex-end; }
  .stop{
    position:relative; flex:0 0 auto; min-width:58px; display:flex; flex-direction:column; align-items:center; gap:5px;
    background:none; border:none; cursor:pointer; padding:8px 6px 6px; border-radius:16px;
  }
  .stop:focus-visible{ outline:3px solid var(--accent); outline-offset:2px; }
  .stop-avatar{ width:50px; height:50px; transition:transform .3s ease; display:block; }
  .stop-avatar svg{ width:100%; height:100%; display:block; }
  .stop.active .stop-avatar{ transform:scale(1.15); filter:drop-shadow(0 4px 8px var(--shadow)); }
  .stop-year{ font-family:'Baloo 2', sans-serif; font-weight:700; font-size:.92rem; font-variant-numeric:tabular-nums; }
  .stop-name{ font-size:.78rem; color:var(--ink-soft); white-space:nowrap; }
  .stop.picked{ background:rgba(232,96,122,.16); }
  .stop.compare-on{ outline:2px dashed var(--accent); outline-offset:1px; }
  .timeline-crown{
    position:absolute; top:-15px; left:50%; transform:translateX(-50%);
    font-size:1.15rem; pointer-events:none;
    filter:drop-shadow(0 2px 3px var(--shadow));
  }

  .compare-zone{ display:flex; flex-direction:column; gap:12px; align-items:center; }
  .compare-launch{
    display:flex; align-items:center; justify-content:center; gap:12px;
    background:transparent; border:2px solid var(--accent);
    padding:12px 26px; border-radius:999px; cursor:pointer;
    transition:background .2s ease;
  }
  .compare-launch:hover{ background:rgba(232,96,122,0.08); }
  .compare-launch.active{ background:var(--accent); }
  .compare-launch.active:hover{ background:var(--accent); }
  .compare-launch:focus-visible{ outline:3px solid var(--accent); outline-offset:2px; }
  .zone-buttons{ display:flex; align-items:center; gap:14px; }
  .icon-btn{
    display:flex; align-items:center; justify-content:center;
    width:52px; height:52px; border-radius:50%; flex-shrink:0;
    background:transparent; border:2px solid var(--accent); color:var(--accent);
    cursor:pointer; transition:background .2s ease;
  }
  .icon-btn:hover{ background:rgba(232,96,122,0.08); }
  .icon-btn:focus-visible{ outline:3px solid var(--accent); outline-offset:2px; }
  .icon-btn span{ font-size:1.6rem; line-height:1; }
  .lightbox{
    position:fixed; inset:0; background:rgba(20,14,10,0.78);
    display:flex; align-items:center; justify-content:center;
    z-index:999; padding:24px;
  }
  .lightbox-inner{ position:relative; max-width:92vw; max-height:88vh; }
  .lightbox-inner img{
    max-width:92vw; max-height:88vh; display:block;
    border-radius:16px; box-shadow:0 20px 50px rgba(0,0,0,0.5);
  }
  .lightbox-placeholder{
    background:var(--card); color:var(--ink-soft); border-radius:16px;
    padding:48px 40px; font-size:1rem; text-align:center; max-width:280px;
    box-shadow:0 20px 50px rgba(0,0,0,0.5);
  }
  .lightbox-close{
    position:absolute; top:-14px; right:-14px; width:36px; height:36px;
    border-radius:50%; border:none; background:#fff; color:var(--ink);
    font-size:1.1rem; line-height:1; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 4px 10px rgba(0,0,0,0.3);
  }
  .lightbox-close:focus-visible{ outline:3px solid var(--accent); outline-offset:2px; }
  .cl-dot{
    border-radius:50%; background:var(--accent); display:flex; align-items:center; justify-content:center;
    transition:background .2s ease; flex-shrink:0;
  }
  .compare-launch.active .cl-dot{ background:#fff; }
  .cl-dot-sm{ width:18px; height:18px; }
  .cl-dot-lg{ width:40px; height:40px; }
  .cl-glass{ font-size:1.2rem; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .compare-panel{
    width:100%; max-width:480px; background:var(--card); border:1px solid var(--card-border);
    border-radius:20px; padding:16px; display:flex; flex-direction:column; gap:12px;
    align-items:center; text-align:center; box-shadow:0 8px 22px var(--shadow);
  }
  .compare-hint{ color:var(--ink-soft); font-size:.92rem; }
  .compare-people{ display:flex; gap:28px; align-items:flex-end; justify-content:center; flex-wrap:wrap; min-height:190px; }
  .compare-person{ position:relative; display:flex; flex-direction:column; align-items:center; gap:6px; min-width:64px; }
  .cp-avatar{ display:block; transition:width .35s ease, height .35s ease; }
  .cp-avatar svg{ width:100%; height:100%; display:block; }
  .compare-person .cp-name{ font-weight:700; font-size:.95rem; }
  .compare-clear{ background:none; border:none; color:var(--ink-soft); text-decoration:underline; cursor:pointer; font-size:.85rem; padding:4px; }
  .compare-clear:focus-visible{ outline:3px solid var(--accent); outline-offset:2px; }

  .foot{ text-align:center; color:var(--ink-soft); font-size:.85rem; }

  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; animation:none !important; }
  }

  var CURRENT_YEAR = new Date().getFullYear();

  function ageFor(year){ return Math.max(0, CURRENT_YEAR - year); }
  function stageFor(age){
    if(age < 1) return 'baby';
    if(age < 5) return 'toddler';
    if(age < 18) return 'kid';
    if(age < 55) return 'adult';
    return 'elder';
  }
  people.forEach(function(p){ p.age = ageFor(p.year); p.stage = stageFor(p.age); });

  // older = bigger, everywhere on the page, using one consistent age->size scale
  var MAX_AGE_REF = Math.max.apply(null, people.map(function(p){ return p.age; })) + 4;
  function sizeFor(age, minPx, maxPx){
    var t = Math.max(0, Math.min(1, age / MAX_AGE_REF));
    return Math.round(minPx + t * (maxPx - minPx));
  }

  // photo avatar: a real circular photo, ring-tinted by life stage
  function avatarSVG(p){
    if(!p.photo){
      return '<span class="avatar-placeholder avatar-' + p.stage + '">' + p.name.charAt(0) + '</span>';
    }
    return '<img src="' + p.photo + '" alt="" class="avatar-photo avatar-' + p.stage + '">';
  }

  var RUNNER_SVG =
    '<svg viewBox="0 0 64 64" role="img" aria-hidden="true">' +
      '<g fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">' +
        '<path d="M32 24 L26 40 L18 54"/>' +
        '<path d="M32 24 L40 37 L50 44"/>' +
        '<path d="M30 27 L18 21"/>' +
        '<path d="M30 27 L44 31"/>' +
        '<path d="M31 24 L33 38"/>' +
      '</g>' +
      '<circle cx="32" cy="14" r="8" fill="currentColor"/>' +
      '<path d="M24 10 L20 6 M40 10 L44 6" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>' +
    '</svg>';

  var sky = document.getElementById('sky');
  var yearNum = document.getElementById('yearNum');
  var storyAvatar = document.getElementById('storyAvatar');
  var storyName = document.getElementById('storyName');
  var storyLine = document.getElementById('storyLine');
  var storyAge = document.getElementById('storyAge');
  var storyBadge = document.getElementById('storyBadge');
  var prevBtn = document.getElementById('prevBtn');
  var nextBtn = document.getElementById('nextBtn');
  var trackWrap = document.getElementById('trackWrap');
  var lane = document.getElementById('lane');
  var runner = document.getElementById('runner');
  var stopsRow = document.getElementById('stopsRow');
  var compareToggle = document.getElementById('compareToggle');
  var comparePanel = document.getElementById('comparePanel');
  var compareHint = document.getElementById('compareHint');
  var comparePeople = document.getElementById('comparePeople');
  var compareClear = document.getElementById('compareClear');
  var extraImgBtn = document.getElementById('extraImgBtn');
  var lightbox = document.getElementById('lightbox');
  var lightboxImg = document.getElementById('lightboxImg');
  var lightboxClose = document.getElementById('lightboxClose');

  runner.innerHTML = RUNNER_SVG;

  // build stops — avatar size scales with age, so "bigger = older" reads at a glance
  var stopEls = people.map(function(p, i){
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'stop';
    btn.dataset.idx = i;
    btn.setAttribute('aria-label', p.name + ', נולד/ה ב-' + p.year);
    var sz = sizeFor(p.age, 32, 78);
    btn.innerHTML =
      '<span class="stop-avatar" style="width:' + sz + 'px;height:' + sz + 'px;">' + avatarSVG(p) + '</span>' +
      '<span class="stop-year">' + p.year + '</span>' +
      '<span class="stop-name">' + p.name + '</span>';
    stopsRow.appendChild(btn);
    return btn;
  });
  // permanent crown on the oldest (biggest) person, as a fixed visual anchor
  var crownEl = document.createElement('span');
  crownEl.className = 'timeline-crown';
  crownEl.textContent = '👑';
  crownEl.setAttribute('aria-hidden', 'true');
  stopEls[0].appendChild(crownEl);

  function lerp(a, b, t){ return a + (b - a) * t; }
  function parseRGB(str){
    var m = str.match(/\d+(\.\d+)?/g);
    return m ? m.map(Number) : [0,0,0];
  }
  function mixRGB(c1, c2, t){
    return 'rgb(' +
      Math.round(lerp(c1[0], c2[0], t)) + ',' +
      Math.round(lerp(c1[1], c2[1], t)) + ',' +
      Math.round(lerp(c1[2], c2[2], t)) + ')';
  }

  function updateSky(t){
    var cs = getComputedStyle(document.documentElement);
    var oldTop = parseRGB(cs.getPropertyValue('--bg-old-top'));
    var oldBot = parseRGB(cs.getPropertyValue('--bg-old-bottom'));
    var newTop = parseRGB(cs.getPropertyValue('--bg-new-top'));
    var newBot = parseRGB(cs.getPropertyValue('--bg-new-bottom'));
    var top = mixRGB(oldTop, newTop, t);
    var bot = mixRGB(oldBot, newBot, t);
    sky.style.background = 'linear-gradient(180deg, ' + top + ' 0%, ' + bot + ' 100%)';
  }

  var current = 0;
  var dragging = false;

  function positionRunner(instant){
    var stopEl = stopEls[current];
    var avatarEl = stopEl.querySelector('.stop-avatar');
    var laneRect = lane.getBoundingClientRect();
    var avRect = avatarEl.getBoundingClientRect();
    var x = (avRect.left - laneRect.left) + avRect.width / 2 - runner.offsetWidth / 2;
    if(instant){ runner.style.transition = 'none'; }
    runner.style.left = x + 'px';
    if(instant){
      // force reflow then restore transition
      void runner.offsetWidth;
      runner.style.transition = '';
    }
  }

  function updateStopStyles(){
    stopEls.forEach(function(el, i){
      el.classList.toggle('active', i === current);
      el.classList.toggle('picked', comparePicks.indexOf(i) !== -1);
      el.classList.toggle('compare-on', compareMode);
    });
  }

  function renderStory(){
    var p = people[current];
    storyAvatar.innerHTML = avatarSVG(p);
    storyName.textContent = p.name;
    storyLine.textContent = 'נולד/ה בשנת ' + p.year;
    storyAge.textContent = p.age === 0 ? 'נולד/ה השנה!' : 'היום, בגיל ' + p.age;
    if(current === 0){
      storyBadge.hidden = false;
      storyBadge.textContent = '⭐ הכי מבוגר/ת בציר!';
    } else if(current === people.length - 1){
      storyBadge.hidden = false;
      storyBadge.textContent = '⭐ הכי צעיר/ה בציר!';
    } else {
      storyBadge.hidden = true;
    }
  }

  function bumpYear(){
    yearNum.classList.remove('pop');
    void yearNum.offsetWidth;
    yearNum.classList.add('pop');
  }

  function selectIndex(i, opts){
    opts = opts || {};
    i = Math.max(0, Math.min(people.length - 1, i));
    current = i;
    yearNum.textContent = people[i].year;
    if(opts.animateYear !== false){ bumpYear(); }
    renderStory();
    updateStopStyles();
    positionRunner(opts.instant === true);
    updateSky(i / (people.length - 1));
    prevBtn.disabled = (i === 0);
    nextBtn.disabled = (i === people.length - 1);
    if(opts.scroll !== false){
      stopEls[i].scrollIntoView({ behavior: opts.instant ? 'auto' : 'smooth', inline: 'center', block: 'nearest' });
    }
  }

  prevBtn.addEventListener('click', function(){ selectIndex(current - 1); });
  nextBtn.addEventListener('click', function(){ selectIndex(current + 1); });

  // click on any stop
  var compareMode = false;
  var comparePicks = [];

  stopsRow.addEventListener('click', function(e){
    var btn = e.target.closest('.stop');
    if(!btn) return;
    var idx = Number(btn.dataset.idx);
    if(compareMode){
      var pos = comparePicks.indexOf(idx);
      if(pos !== -1){ comparePicks.splice(pos, 1); }
      else {
        comparePicks.push(idx);
        if(comparePicks.length > 2){ comparePicks.shift(); }
      }
      renderCompare();
      updateStopStyles();
    } else {
      selectIndex(idx);
    }
  });

  // keyboard navigation
  stopsRow.addEventListener('keydown', function(e){
    if(e.key === 'ArrowLeft'){ selectIndex(current + 1); e.preventDefault(); }
    else if(e.key === 'ArrowRight'){ selectIndex(current - 1); e.preventDefault(); }
    else if(e.key === 'Home'){ selectIndex(0); e.preventDefault(); }
    else if(e.key === 'End'){ selectIndex(people.length - 1); e.preventDefault(); }
  });

  // drag the runner
  function nearestIndexFromClientX(clientX){
    var best = 0, bestDist = Infinity;
    stopEls.forEach(function(el, i){
      var r = el.getBoundingClientRect();
      var cx = r.left + r.width / 2;
      var d = Math.abs(cx - clientX);
      if(d < bestDist){ bestDist = d; best = i; }
    });
    return best;
  }

  runner.addEventListener('pointerdown', function(e){
    dragging = true;
    runner.setPointerCapture(e.pointerId);
    runner.style.transition = 'none';
    sky.style.transition = 'none';
  });

  runner.addEventListener('pointermove', function(e){
    if(!dragging) return;
    var laneRect = lane.getBoundingClientRect();
    var wrapRect = trackWrap.getBoundingClientRect();
    var minX = 0;
    var maxX = laneRect.width - runner.offsetWidth;
    var x = e.clientX - laneRect.left - runner.offsetWidth / 2;
    x = Math.max(minX, Math.min(maxX, x));
    runner.style.left = x + 'px';

    // live feedback: continuous fraction across full lane width
    var frac = laneRect.width > runner.offsetWidth ? x / (laneRect.width - runner.offsetWidth) : 0;
    frac = Math.max(0, Math.min(1, frac));
    updateSky(frac);
    var idx = nearestIndexFromClientX(e.clientX);
    yearNum.textContent = people[idx].year;

    // autoscroll near edges
    var edge = 36;
    if(e.clientX - wrapRect.left < edge){ trackWrap.scrollLeft -= 12; }
    else if(wrapRect.right - e.clientX < edge){ trackWrap.scrollLeft += 12; }
  });

  function endDrag(e){
    if(!dragging) return;
    dragging = false;
    runner.style.transition = '';
    sky.style.transition = '';
    var idx = nearestIndexFromClientX(e.clientX);
    selectIndex(idx, { animateYear:false });
  }
  runner.addEventListener('pointerup', endDrag);
  runner.addEventListener('pointercancel', endDrag);

  // compare mode
  compareToggle.addEventListener('click', function(){
    compareMode = !compareMode;
    compareToggle.classList.toggle('active', compareMode);
    compareToggle.setAttribute('aria-pressed', String(compareMode));
    comparePanel.hidden = !compareMode;
    comparePicks = [];
    renderCompare();
    updateStopStyles();
  });

  compareClear.addEventListener('click', function(){
    comparePicks = [];
    renderCompare();
    updateStopStyles();
  });

  function renderCompare(){
    comparePeople.innerHTML = '';
    if(comparePicks.length === 0){
      compareHint.hidden = false;
      compareHint.textContent = 'לחצי על שני אנשים בציר כדי להשוות ביניהם';
      compareClear.hidden = true;
      return;
    }
    compareClear.hidden = false;

    // who is older is shown ONLY by a bigger circle, sized relative to the
    // two chosen people (not the whole timeline scale) so the size gap is
    // always obvious even when the two are close in age. A tie -> equal, both big.
    var sizes = {};
    if(comparePicks.length === 2){
      var yearA = people[comparePicks[0]].year, yearB = people[comparePicks[1]].year;
      if(yearA === yearB){
        sizes[comparePicks[0]] = 130;
        sizes[comparePicks[1]] = 130;
      } else {
        var olderIdx = yearA < yearB ? comparePicks[0] : comparePicks[1];
        var youngerIdx = yearA < yearB ? comparePicks[1] : comparePicks[0];
        sizes[olderIdx] = 160;
        sizes[youngerIdx] = 74;
      }
    } else {
      comparePicks.forEach(function(idx){ sizes[idx] = 110; });
    }

    comparePicks.forEach(function(idx){
      var p = people[idx];
      var sz = sizes[idx];
      var wrap = document.createElement('div');
      wrap.className = 'compare-person';
      wrap.innerHTML =
        '<span class="cp-avatar" style="width:' + sz + 'px;height:' + sz + 'px;">' + avatarSVG(p) + '</span>' +
        '<span class="cp-name">' + p.name + '</span>';
      comparePeople.appendChild(wrap);
    });

    if(comparePicks.length < 2){
      compareHint.hidden = false;
      compareHint.textContent = 'עכשיו לחצי על עוד מישהו/מישהי כדי להשוות';
    } else {
      compareHint.hidden = true;
    }
  }

  // extra photo lightbox — image src gets set once the photo is provided
  extraImgBtn.addEventListener('click', function(){
    lightbox.hidden = false;
  });
  lightboxClose.addEventListener('click', function(){
    lightbox.hidden = true;
  });
  lightbox.addEventListener('click', function(e){
    if(e.target === lightbox){ lightbox.hidden = true; }
  });
  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape' && !lightbox.hidden){ lightbox.hidden = true; }
  });

  window.addEventListener('resize', function(){ positionRunner(true); });

  // init
  selectIndex(0, { instant:true, scroll:false });
})();
</script>
</body></html>
